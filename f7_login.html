<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="Author" content="Ruchika">
    <meta name="Description" content="This is a login page">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap');

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            min-height: 100dvh;
            background: radial-gradient( #1f76ba, #004493);
            font-family: 'Dancing Script', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        section{
            background-color:black;
            width: 20rem;
            padding:1rem;
            border-radius: 8px;
            box-shadow: 0px 5px 10px rgb(44, 44, 44);
            font-size: 1.2rem;
            display: flex;
            border: 2px solid #b4b6b6;
            justify-content: center;
        }
        input{
            background-color: #303031;
            color: white;
            font-size: 1rem;
            height: 40px;
            padding: 2px 10px;
            font-size: 1.1rem;
            width: 100%;
            outline: none;
            border: none;
            border-bottom: #b4b6b6 3px solid;
        }
        label{
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <section>
        <form>
            <center><h2 style="color: white; font-size: 2rem;"><b> Login</b></h2><br></center>
            <label for="email">Email:</label><br>
            <input type="email" name="email" placeholder="Enter your email" required><br><br>
            <label for="password">Password:</label><br>
            <input type="password" name="password" placeholder="Enter your password" required ><br><br><br>
            <input type="submit" value="Submit" style="background-color: #056ce1; color: white; font-size: 1.2rem; font-family: 'Dancing Script', cursive; font-weight: bold; border: 2px solid #056ce1;"><br><br>
        </form>
    </section>
</body>
</html>
