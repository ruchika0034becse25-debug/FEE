<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="Ruchika Verma">
    <link rel="'stylesheet" href="">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap'); 
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        body {
            min-height: 100dvh;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            background-color: white;
            color: white;
        }
        section {padding: 10px;}
        .box {background-color: darkred;}
        .fc {
            display: flex;
            gap: 50px;
            flex-direction: column;
            /*justify-content: flex-start;*/
            /*justify-content: flex-end;*/
            justify-content: center;
            /*align-items: flex-start;*/
            /*align-items: flex-end;*/
            align-items: center;
        }
    </style>
    <title>Flex Box</title>
</head>
<body>
    <section class="box" style="height: 10vh">
        Header/Navbar
    </section>
    <section class="fc" style="height: 80vh; background-color: white;">
        <main class="box" style="height: 150px; width: 200px; padding: 10px">
            Main-1
        </main>
        <main class="box" style="height: 150px; width: 200px; padding: 10px">
            Main-2
        </main>
    </section>
    <section class="box" style="position :absolute; bottom: 0; left: 0; height: 10vh; width:100%">
        Footer
    </section>
    <script></script>
    
</body>
</html>
