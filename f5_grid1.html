<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="Ruchika">
    <link rel="'stylesheet" href="">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap'); 
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        body {
            min-height: 100dvh;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
           
            color: white;
        }
        section {padding: 10px;}
        .box {background-color: darkred;
              color: white;
              padding: 1rem;}
        .gc{
            display:grid;
            gap:0.5rem;

            grid-template-columns: 150px 250px;
            grid-template-rows: repeat(3, 150px);
            place-content: center;
        }
        @media(min-width: 767px){
            .gc{
                grid-template-columns: 200px 200px 200px;
                grid-template-rows: 200px 200px;
            }
        }
        @media(min-width: 1024px){
            .gc{
                grid-template-columns: repeat(4, 250px);
                grid-template-rows: repeat(2, 250px);
            }
            #m6{
                grid-column: 2/span 3;
            }
        }
    </style>
    <title>Document</title>
</head>
<body>
    <section class="box" style="height: 10vh">
        <span style="font-size:2.5rem; margin-right:1rem">&#9813</span>
        Header/NavBar
    </section>
    <section
    class="box gc"
    style="height: 80vh; background-color: white;">
    <main class="box" id="m1">content-1</main>
    <main class="box" id="m2">content-2</main>
    <main class="box" id="m3">content-3</main>
    <main class="box" id="m4">content-4</main>
    <main class="box" id="m5">content-5</main>
    <main class="box" id="m6">content-6</main>
    </section>
    <section class="box" style="height: 10vh; position:absolute; bottom:0; left:0; width:100%;">
        <span style="font-size:2.5rem; margin-right:1rem">&#9776</span>
        Footer
    </section>
    <script></script>
    
</body>
</html>
